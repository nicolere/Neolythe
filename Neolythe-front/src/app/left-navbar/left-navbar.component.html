<div class="flex column left-navbar">

  <div class="row">
    <mat-card id="current-rate" class="positiv">
      <mat-card-content>
        <p id="small-title" class="muli-b text-white">Current rate</p>
        <span id="rate-sigle" class="poppins-sb text-white">
          $<span id="rate-value" class="poppins-sb text-white">1,923.46</span>
        </span>
      </mat-card-content>
    </mat-card>
  </div>

  <mat-nav-list>
    <mat-list-item *ngFor="let link of navigationLinks" [routerLink]="link.routerLink" 
    routerLinkActive="{{ link.routerLinkActive ? 'active' : '' }}" class="text-smoothblack poppins-m">
      <mat-icon>{{ link.iconName }}</mat-icon>
      <a>{{ link.linkName }}</a>
    </mat-list-item>
  </mat-nav-list>

  <section class="flex column dark-mode-copyright-content">
    <div id="slider-and-copyright">
      <mat-slide-toggle color="green" class="slide-toggle-dark-mode">Dark Mode</mat-slide-toggle>
    </div>
    <div>
      <p id="copyright-text" class="poppins-r text-lightgrey">© Copyright Personal Project</p>
    </div>
  </section>
</div>
